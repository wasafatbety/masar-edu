@example.com"></div>
                        <div class="form-group"><label>رقم هاتف ولي الأمر</label><input type="tel" id="newParentPhone" class="input-box" placeholder="مثال: 01012345678"></div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label>المرحلة / الحقل التعليمي</label>
                                <select id="newStudentStage" class="input-box" style="background: #1e1b4b;" onchange="updateGradeOptions('newStudentStage', 'newStudentGrade')">
                                    <option value="الابتدائية">الابتدائية 🏫</option>
                                    <option value="الإعدادية">الإعدادية 📚</option>
                                    <option value="الثانوية العامة">الثانوية العامة 🎓</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>الصف / المستوى الدراسي</label>
                                <select id="newStudentGrade" class="input-box" style="background: #1e1b4b;">
                                    <option value="الصف الأول">الصف الأول</option>
                                    <option value="الصف الثاني">الصف الثاني</option>
                                    <option value="الصف الثالث">الصف الثالث</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group"><label>إجمالي قيمة الاشتراك (ج.م)</label><input type="number" id="newFeeTotal" class="input-box" placeholder="1000"></div>
                            <div class="form-group"><label>المبلغ المدفوع (ج.م)</label><input type="number" id="newFeePaid" class="input-box" placeholder="500"></div>
                        </div>

                        <button class="btn-submit" onclick="addNewStudent()">حفظ البيانات والملف المالي والتعليمي للترم النشط</button>
                    </div>
                </div>

                <div class="collapsible-card active">
                    <div class="collapsible-header" onclick="toggleCollapsible(this)">
                        <h3 style="color: var(--primary);"><i class="fa-solid fa-users"></i> إدارة كافة الطلاب والملف المالي والأكاديمي</h3>
                        <i class="fa-solid fa-chevron-down collapsible-icon"></i>
                    </div>
                    <div class="collapsible-content">
                        <div class="semester-tab-container">
                            <button id="tabSem1" class="semester-tab-btn active" onclick="switchStudentAdminTab('الترم الأول')">🟢 الترم الأول</button>
                            <button id="tabSem2" class="semester-tab-btn" onclick="switchStudentAdminTab('الترم الثاني')">🔵 الترم الثاني</button>
                        </div>
                        <div id="studentsList"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Modals & Dialogs -->
    <div id="studentActivationModal" class="modal-overlay">
        <div class="modal-body" style="text-align: center;">
            <i class="fa-solid fa-mobile-screen-button" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
            <h3 style="color: white; font-size: 1.2rem; margin-bottom: 10px;">مرحباً بك في منظومة Masar Edu system</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; margin-bottom: 15px;">
                أهلاً بك <strong id="activationStudentName" style="color: var(--warning);">الطالب</strong>، لتأكيد التفعيل وحماية حسابك سيتم ربط كارت الباركود بهذا الهاتف تحديداً.
            </p>
            <button class="btn-submit" onclick="confirmStudentActivation()" style="background: linear-gradient(135deg, #10b981, #059669);">
                <i class="fa-solid fa-check-circle"></i> موافقة وتفعيل الكارت على هذا الهاتف
            </button>
        </div>
    </div>

    <div id="customDialog" class="custom-dialog-overlay">
        <div class="custom-dialog-box">
            <div id="customDialogIcon" class="custom-dialog-icon"></div>
            <div id="customDialogTitle" class="custom-dialog-title"></div>
            <div id="customDialogMsg" class="custom-dialog-msg"></div>
            <div id="customDialogBtns" class="custom-dialog-btns"></div>
        </div>
    </div>

    <!-- JavaScript Logic & Firebase Integration -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDX2kMWtPt4zZo5eBui-5O_aeMRB7ejfqQ",
            authDomain: "masar-edu-control-system.firebaseapp.com",
            databaseURL: "https://masar-edu-system-default-rtdb.firebaseio.com",
            projectId: "masar-edu-control-system",
            storageBucket: "masar-edu-control-system.firebasestorage.app",
            messagingSenderId: "123456789012",
            appId: "1:322216005890:web:97771a5ffc62d3785b721b"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentRole = 'selector';
        let activeSemester = 'الترم الأول';
        let currentAdminDate = new Date().toISOString().split('T')[0];
        let currentDriverDate = new Date().toISOString().split('T')[0];
        let currentStudent = null;
        let currentParent = null;
        let currentDriverBus = null;
        let html5QrcodeScanner = null;
        let activeAdminTabSemester = 'الترم الأول';

        document.addEventListener("DOMContentLoaded", () => {
            const todayStr = new Date().toISOString().split('T')[0];
            if (document.getElementById('adminReportDate')) document.getElementById('adminReportDate').value = todayStr;
            if (document.getElementById('driverReportDate')) document.getElementById('driverReportDate').value = todayStr;

            currentAdminDate = todayStr;
            currentDriverDate = todayStr;

            if (typeof emailjs !== 'undefined') {
                emailjs.init("Gn4QPvQG68ewJftky");
            }

            db.collection("settings").doc("academic").get().then(doc => {
                if (doc.exists && doc.data().activeSemester) {
                    activeSemester = doc.data().activeSemester;
                    document.getElementById('quickDriverSemesterSelect').value = activeSemester;
                    document.getElementById('activeSemesterSelect').value = activeSemester;
                }
            }).catch(err => console.log("Settings fetch error:", err));

            switchUserRole('selector');
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function navigateTo(viewId, titleStr) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const targetView = document.getElementById(viewId);
            if (targetView) targetView.classList.add('active');
            document.getElementById('currentPageTitle').innerText = titleStr || 'المنظومة التعليمية';
            
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }

            if (viewId === 'adminTab' && currentRole === 'admin') {
                loadAdminDashboardData();
            }
        }

        function switchUserRole(role) {
            currentRole = role;
            const toggleBtn = document.getElementById('mainSidebarToggleBtn');
            const navContainer = document.getElementById('dynamicNavItems');
            const roleTitle = document.getElementById('roleSectionTitle');

            if (role === 'selector') {
                toggleBtn.style.display = 'none';
                navigateTo('portalSelectorTab', 'اختيار الواجهة');
                return;
            }

            toggleBtn.style.display = 'flex';
            let navHtml = '';

            if (role === 'student') {
                roleTitle.innerText = 'خدمات الطالب';
                navHtml = `<button class="nav-item active" onclick="navigateTo('studentTab', 'بوابة الطالب الذكية')"><i class="fa-solid fa-id-card"></i> كارت الباركود والقرارات</button>`;
                navigateTo('studentTab', 'بوابة الطالب الذكية');
            } else if (role === 'parent') {
                roleTitle.innerText = 'خدمات ولي الأمر';
                navHtml = `<button class="nav-item active" onclick="navigateTo('parentTab', 'متابعة ولي الأمر')"><i class="fa-solid fa-users-viewfinder"></i> المتابعة اللحظية والأقساط</button>`;
                navigateTo('parentTab', 'متابعة ولي الأمر');
            } else if (role === 'driver') {
                roleTitle.innerText = 'خدمات المعلم والأنشطة';
                navHtml = `
                    <button class="nav-item active" onclick="navigateTo('scanTab', 'ماسح حضور القاعة')"><i class="fa-solid fa-camera"></i> ماسح الحضور الذكي</button>
                    <button class="nav-item" onclick="navigateTo('logsTab', 'تقرير حضور المجموعة')"><i class="fa-solid fa-list-check"></i> تقرير الحضور اليومي</button>
                `;
                navigateTo('scanTab', 'ماسح حضور القاعة');
            } else if (role === 'admin') {
                roleTitle.innerText = 'لوحة الإشراف والمالية';
                navHtml = `<button class="nav-item active" onclick="navigateTo('adminTab', 'لوحة المشرف والإدارة المالية')"><i class="fa-solid fa-user-shield"></i> لوحة التحكم والمالية</button>`;
                navigateTo('adminTab', 'لوحة المشرف والإدارة المالية');
            } else if (role === 'unified') {
                roleTitle.innerText = 'الدخول الموحد';
                navHtml = `<button class="nav-item active" onclick="navigateTo('unifiedTab', 'تسجيل الدخول الموحد')"><i class="fa-solid fa-right-to-bracket"></i> بوابة الدخول الموحدة</button>`;
                navigateTo('unifiedTab', 'تسجيل الدخول الموحد');
            }

            navContainer.innerHTML = navHtml;
        }

        function toggleCollapsible(headerElem) {
            headerElem.parentElement.classList.toggle('active');
        }

        function updateSemesterSetting(newVal) {
            activeSemester = newVal;
            document.getElementById('quickDriverSemesterSelect').value = newVal;
            document.getElementById('activeSemesterSelect').value = newVal;

            db.collection("settings").doc("academic").set({
                activeSemester: newVal,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                showCustomDialog("fa-solid fa-circle-check", "تم التحديث", `تم اعتماد ${newVal} كفصل دراسي نشط للمنظومة.`);
                if (currentRole === 'admin') loadAdminDashboardData();
            });
        }

        function loginStudentPortal() {
            const studentId = document.getElementById('studentLoginId').value.trim();
            if (!studentId) {
                showCustomDialog("fa-solid fa-triangle-exclamation", "تنبيه", "يرجى كتابة كود الطالب بشكل صحيح.");
                return;
            }

            db.collection("students").doc(studentId).get().then(doc => {
                if (!doc.exists) {
                    showCustomDialog("fa-solid fa-circle-xmark", "خطأ", "كود الطالب غير مسجل بالمنظومة.");
                    return;
                }

                const data = doc.data();
                currentStudent = { id: doc.id, ...data };
                renderStudentCardUI(data);
            });
        }

        function renderStudentCardUI(data) {
            document.getElementById('studentAuthCard').style.display = 'none';
            document.getElementById('studentPortalContent').style.display = 'block';

            document.getElementById('studentCardName').innerText = data.name || 'طالب مسار';
            document.getElementById('studentCardId').innerText = `كود الطالب: ${data.id}`;
            document.getElementById('studentAcademicBadge').innerText = `${data.stage || ''} - ${data.grade || ''}`;

            const statusElem = document.getElementById('studentCardStatus');
            statusElem.innerText = data.status === 'مفعل' ? 'الحساب مفعل 🟢' : 'موقف 🔴';

            const qrCanvas = document.getElementById('qrcodeCanvas');
            qrCanvas.innerHTML = '';
            new QRCode(qrCanvas, {
                text: JSON.stringify({ id: data.id, name: data.name, status: data.status }),
                width: 180,
                height: 180
            });
        }

        function logoutStudentPortal() {
            currentStudent = null;
            document.getElementById('studentPortalContent').style.display = 'none';
            document.getElementById('studentAuthCard').style.display = 'block';
            document.getElementById('studentLoginId').value = '';
        }

        // ==========================================
        // 🔔 دوال الإشعارات والـ VAPID المحدثة بالكامل
        // ==========================================
        function requestBrowserNotificationPermission() {
            if (!('serviceWorker' in navigator) || typeof firebase === 'undefined') {
                showCustomDialog("fa-solid fa-triangle-exclamation", "غير مدعوم", "المتصفح لا يدعم خدمة الإشعارات أو Firebase غير معرف.");
                return;
            }

            const messaging = firebase.messaging();

            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    messaging.getToken({ 
                        vapidKey: 'BBTDLPFV6CLvM11VfuZm6SxsVmGhoVi9bBJoPg5vJxfoV2iKDkawoLtI4undilGeSlprzxsr3pmhY0sQEb3Nos4' 
                    }).then((currentToken) => {
                        if (currentToken && currentStudent) {
                            db.collection("students").doc(currentStudent.id).update({
                                fcmToken: currentToken,
                                tokenUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }).catch(err => console.log("خطأ حفظ Token الطالب:", err));
                        }
                    }).catch(err => console.log("خطأ في جلب الـ Token:", err));

                    showCustomDialog("fa-solid fa-circle-check", "تم التفعيل بنجاح", "تم تفعيل الإشعارات الفورية على هذا الهاتف!");
                    new Notification("منظومة مسار التعليمية", {
                        body: "تم تفعيل التنبيهات بنجاح لاستقبال الإشعارات.",
                        icon: "icon-192.png"
                    });
                } else {
                    showCustomDialog("fa-solid fa-circle-xmark", "تم رفض الإذن", "تم رفض إذن الإشعارات من المتصفح.");
                }
            });
        }

        function requestParentNotificationPermission() {
            if (!('serviceWorker' in navigator) || typeof firebase === 'undefined') {
                showCustomDialog("fa-solid fa-triangle-exclamation", "غير مدعوم", "المتصفح لا يدعم خدمة الإشعارات أو Firebase غير معرف.");
                return;
            }

            const messaging = firebase.messaging();

            Notification.requestPermission().then((permission) => {
                if (permission === "granted") {
                    messaging.getToken({ 
                        vapidKey: 'BBTDLPFV6CLvM11VfuZm6SxsVmGhoVi9bBJoPg5vJxfoV2iKDkawoLtI4undilGeSlprzxsr3pmhY0sQEb3Nos4' 
                    }).then((currentToken) => {
                        if (currentToken && currentParent) {
                            db.collection("parents").doc(currentParent.phone).update({
                                fcmToken: currentToken,
                                tokenUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }).catch(err => console.log("خطأ حفظ Token ولي الأمر:", err));
                        }
                    }).catch(err => console.log("خطأ في جلب الـ Token لولي الأمر:", err));

                    showCustomDialog("fa-solid fa-circle-check", "تم تفعيل إشعارات ولي الأمر", "تم تفعيل التنبيهات الفورية على هذا الهاتف بنجاح!");
                    new Notification("منظومة مسار التعليمية - متابعة ولي الأمر", {
                        body: "تم ربط هذا الهاتف بنجاح لاستقبال تنبيهات حضور الطلاب.",
                        icon: "icon-192.png"
                    });
                } else {
                    showCustomDialog("fa-solid fa-circle-xmark", "تم رفض الإذن", "تم رفض إذن الإشعارات.");
                }
            });
        }

        function showCustomDialog(iconClass, title, message) {
            document.getElementById('customDialogIcon').innerHTML = `<i class="${iconClass}" style="color: var(--primary);"></i>`;
            document.getElementById('customDialogTitle').innerText = title;
            document.getElementById('customDialogMsg').innerText = message;
            document.getElementById('customDialogBtns').innerHTML = `<button class="btn-submit" style="width: auto; padding: 10px 30px;" onclick="closeCustomDialog()">حسناً</button>`;
            document.getElementById('customDialog').style.display = 'flex';
        }

        function closeCustomDialog() {
            document.getElementById('customDialog').style.display = 'none';
        }
    </script>
</body>
</html>
